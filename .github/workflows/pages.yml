name: Dedicated Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shared core regression tests
        run: make -j2 test
      - name: WASM and native adapter parity
        env:
          CLANG: clang
        run: |
          python3 tools/build_web.py
          python3 tools/verify_web.py
      - name: Assemble verified firmware and complete audio gallery
        run: |
          python3 tools/assemble_pages.py --firmware-dir artifacts/firmware
          node tests/gallery.mjs
          node tests/install.mjs
          node tests/demo-songs.mjs
          node tests/site-cache.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
